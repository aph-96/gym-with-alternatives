<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Workout Tracker</title>
    <link rel="stylesheet" href="css/styles.css" />
    <link rel="manifest" href="manifest.json" />
    <meta name="theme-color" content="#a855f7" />
  </head>
  <body>
    <div id="loading-screen">
      <img src="icons/icon-512.png" alt="Gym Logo" class="loading-logo" />

      <h1 class="glitch" data-text="GYM TRACKER">GYM TRACKER</h1>

      <div class="loading-bar">
        <div class="loading-progress"></div>
      </div>
    </div>
    <div class="fullscreen-center">
      <h1>Workout Tracker</h1>

      <!-- Workout Cards -->
      <div class="card-container">
        <a href="select-workout.html" class="card">
          <h2>🏋️ Gym Workouts</h2>
          <p>Push • Pull • Legs • Core</p>
        </a>

        <a href="select-workout-home.html" class="card">
          <h2>🏠 At Home Workouts</h2>
          <p>Dumbbells • Bands • Bodyweight</p>
        </a>
        <a href="select-workout-pt.html" class="card">
          <h2>👨‍💼 Personal Training</h2>
          <p>Customized Plans • One-on-One Sessions</p>
        </a>
      </div>


      <div class="card-container activity-log-grid">
        <h2>Other Activity</h2>
        <button id="activity-climbing" class="card activity-card" data-log-activity="climbing"><h2>🧗 Rock Climbing</h2><p>Log a climbing session</p></button>
        <button id="activity-physio" class="card activity-card" data-log-activity="physio"><h2>💗 Physio / Rehab</h2><p>Log rehab or physio work</p></button>
        <button id="activity-mobility" class="card activity-card" data-log-activity="mobility"><h2>🧘 Mobility / Stretching</h2><p>Log mobility or stretching</p></button>
      </div>

      <!-- Import / Export Buttons -->
      <div class="button-container">
        <button class="import-export" onclick="exportData()">
          Export All Workouts
        </button>
        <button
          class="import-export"
          onclick="document.getElementById('importFile').click()"
        >
          Import Workouts
        </button>
        <input
          type="file"
          id="importFile"
          onchange="importData(event)"
          style="display: none"
        />
      </div>
    </div>

    <div id="activityModal" class="modal"><div class="modal-content"><h3 id="activityModalTitle">Log Activity</h3><div class="form-group"><label for="activityDate">Date:</label><input type="date" id="activityDate" /></div><div class="form-group"><label for="activityNotes">Notes:</label><textarea id="activityNotes" class="activity-notes" placeholder="Optional notes about what you did"></textarea></div><div class="modal-buttons"><button id="cancelActivity" class="action-button">Cancel</button><button id="saveActivity" class="toggle-button">Log Activity</button></div></div></div>
    <script src="js/app.js"></script>
    <script src="js/activity-log.js"></script>
    <script>
      window.addEventListener("load", () => {
        setTimeout(() => {
          const loader = document.getElementById("loading-screen");
          loader.style.display = "none";
        }, 3200);
      });
    </script>
    <script src="js/navigation.js"></script>
  </body>
</html>
